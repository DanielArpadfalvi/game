name: Deploy to GitHub Pages

# A GitHub futtatóinak nyílt internetük van, így a build közben letölti a valódi
# Data Dragon bajnok-képeket, majd publikálja a kész játékot GitHub Pages-re.

on:
  push:
    branches:
      - claude/browser-lol-game-ideas-csgj7i
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Valódi bajnok-képek letöltése (Data Dragon). Ha bármiért nem elérhető,
      # a build placeholderrel folytatódik ahelyett, hogy elhasalna.
      - name: Fetch champion assets
        run: npm run fetch-assets
        continue-on-error: true

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
